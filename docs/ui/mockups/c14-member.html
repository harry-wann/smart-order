<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-14｜會員中心</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-14｜會員中心</b><code>375 × 812</code><code>/member</code><code>卡片底用木桌紋理（弱化）</code></p>
  <div class="frame f-mobile">

    <header class="appbar">
      <button class="iconbtn"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="ttl">會員中心</div>
      <button class="iconbtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M20 12h1.5M2.5 12H4M12 4V2.5M12 21.5V20M17.7 6.3l1-1M5.3 18.7l1-1M17.7 17.7l1 1M5.3 5.3l1 1"/></svg></button>
    </header>

    <div class="scroll">

      <!-- 會員卡：木桌紋理弱化後當底 -->
      <div style="padding:16px">
        <div class="card" style="position:relative;overflow:hidden;padding:0;border-color:#D9C7AE">
          <div class="img-ph" style="position:absolute;inset:0;border:0;border-radius:0;opacity:.3" data-layer="IMG／木桌紋理／2-1">
            <b>質感木桌紋理</b><span>800×400・2:1</span><span class="kw">dark wood table texture</span>
          </div>
          <div style="position:relative;padding:20px">
            <div class="r g8">
              <div class="fill">
                <div class="h2">陳小美</div>
                <div class="t-cap num">0912-345-678</div>
              </div>
              <span class="badge b-plain">入會 2 年</span>
            </div>
            <div class="r g8 mt24" style="align-items:flex-end">
              <div>
                <div class="t-cap">可用點數</div>
                <div class="display" style="color:var(--brand-600);line-height:1.1">1,248</div>
              </div>
              <span class="fill"></span>
              <div class="right">
                <div class="t-cap">累積消費</div>
                <div class="h3 num">24 次</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="c g12" style="padding:0 16px">
        <div class="mi" style="min-height:auto;padding:16px">
          <svg class="ic ic-lg" viewBox="0 0 24 24" style="color:var(--brand-600)"><path d="M4 2v20l2-1.5L8 22l2-1.5L12 22l2-1.5L16 22l2-1.5L20 22V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          <div class="body"><div class="nm">消費紀錄</div><div class="ds">看每一次來吃了什麼、花了多少</div></div>
          <svg class="ic dim" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="mi" style="min-height:auto;padding:16px">
          <svg class="ic ic-lg" viewBox="0 0 24 24" style="color:var(--brand-600)"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 10h18M8 2.5v4M16 2.5v4M8 15h3"/></svg>
          <div class="body"><div class="nm">我的預約</div><div class="ds">9/20（六）18:30・4 位</div></div>
          <span class="badge b-rec">1 筆</span>
          <svg class="ic dim" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="mi" style="min-height:auto;padding:16px">
          <svg class="ic ic-lg" viewBox="0 0 24 24" style="color:var(--brand-600)"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div class="body"><div class="nm">個人資料</div><div class="ds">暱稱、生日、手機號碼</div></div>
          <svg class="ic dim" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

      <div class="px16 mt24">
        <div class="infobox ib-quiet">
          <svg class="ic" viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg>
          <div>消費金額每 10 元累積 1 點。生日當月來，送一份季節甜點。</div>
        </div>
      </div>

    </div>

    <div class="bottombar">
      <button class="btn btn-ghost btn-md btn-block">登出</button>
    </div>

  </div>
</div>

</div>
</body>
</html>
