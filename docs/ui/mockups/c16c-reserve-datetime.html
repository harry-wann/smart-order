<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-16c｜預約 1 日期時段人數</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-16c｜預約 步驟 1　日期時段人數</b><code>375 × 812</code><code>/reserve/when</code></p>
  <div class="frame f-mobile">

    <header class="appbar">
      <button class="iconbtn"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="ttl">線上訂位</div>
    </header>

    <div class="steps">
      <span class="s on"><span class="n">1</span>選時間</span>
      <span class="bar"></span>
      <span class="s"><span class="n">2</span>先點餐</span>
      <span class="bar"></span>
      <span class="s"><span class="n">3</span>完成</span>
    </div>

    <div class="scroll">
      <div class="hero" style="height:120px">
        <div class="img-ph" style="height:100%;border-radius:0;border:0" data-layer="IMG／餐廳環境-包廂／16-9">
          <b>餐廳環境／包廂</b><span>1600×900・16:9（上下裁切）</span>
          <span class="kw">asian restaurant private room</span>
        </div>
      </div>

      <div style="padding:16px 16px 0">
        <div class="r g8" style="margin-bottom:12px">
          <span class="h3 fill">9 月</span>
          <span class="t-cap">可訂 明天起 30 天內</span>
        </div>
        <div class="cal">
          <div class="hd">日</div><div class="hd">一</div><div class="hd">二</div><div class="hd">三</div><div class="hd">四</div><div class="hd">五</div><div class="hd">六</div>
          <div class="d off">13</div><div class="d">14</div><div class="d">15</div><div class="d">16</div><div class="d">17</div><div class="d">18</div><div class="d">19</div>
          <div class="d">20</div><div class="d on">21</div><div class="d">22</div><div class="d">23</div><div class="d">24</div><div class="d">25</div><div class="d">26</div>
          <div class="d">27</div><div class="d">28</div><div class="d">29</div><div class="d">30</div><div class="d">1</div><div class="d">2</div><div class="d">3</div>
        </div>

        <div class="r g8 mt24" style="margin-bottom:12px">
          <span class="h3 fill">時段</span>
          <span class="t-cap">用餐時間 100 分鐘</span>
        </div>
        <div class="r g8" style="gap:8px">
          <div class="slot fill">17:00</div>
          <div class="slot fill">17:30</div>
          <div class="slot fill on">18:00</div>
          <div class="slot fill full">18:30</div>
          <div class="slot fill">19:00</div>
        </div>
        <p class="hint">18:30 已額滿。虛線框的時段不能點。</p>

        <div class="r g8 mt16" style="margin-bottom:12px">
          <span class="h3 fill">人數</span>
        </div>
        <div class="r g16" style="padding-bottom:24px">
          <div class="bigstep">
            <button><svg class="ic ic-lg" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
            <div class="n">4</div>
            <button><svg class="ic ic-lg" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
          </div>
          <div class="fill t-sm" style="margin:0">將為您安排<br><b style="color:var(--text-900)">4 人桌・窗邊區</b></div>
        </div>
      </div>
    </div>

    <div class="bottombar">
      <button class="btn btn-primary btn-lg btn-block">
        <span>下一步</span><span class="fill"></span><span class="num">9/21（一）18:00・4 位</span>
      </button>
    </div>

  </div>
</div>

</div>
</body>
</html>
