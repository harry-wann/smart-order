<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-07｜送出成功</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-07｜送出成功</b><code>375 × 812</code><code>/order/submitted</code><code>勾勾描邊 0.6 秒後停住</code></p>
  <div class="frame f-mobile">

    <div class="scroll c" style="justify-content:center;align-items:center;padding:0 24px;text-align:center">
      <div class="doneball">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="h1 mt24">第 2 單已送出</h1>
      <p class="t-sm mt8" style="margin-bottom:0">廚房已經收到，請稍候。<br>同桌其他人的手機也會看到這張單。</p>

      <div class="card card-tight mt32" style="width:100%;text-align:left">
        <div class="t-cap">這一單的內容</div>
        <div class="tick" style="padding-top:8px">
          <span class="badge b-wait">製作中</span>
          <div class="fill">
            <div class="nm">安格斯霜降牛五花 ×1</div>
            <div class="op">全份・加蔥花・備註：不要太生</div>
          </div>
        </div>
        <div class="tick">
          <span class="badge b-wait">製作中</span>
          <div class="fill"><div class="nm">白飯 ×2</div><div class="op">免費續加</div></div>
        </div>
      </div>

      <p class="t-cap mt16" style="margin-bottom:0">2 秒後自動帶你去看出菜進度</p>
    </div>

    <div class="bottombar">
      <button class="btn btn-primary btn-lg btn-block">繼續點餐</button>
      <button class="btn btn-secondary btn-lg btn-block mt12">查看本桌訂單</button>
    </div>

  </div>
</div>

</div>
</body>
</html>
