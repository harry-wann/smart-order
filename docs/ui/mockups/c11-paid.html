<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-11｜付款完成</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-11｜付款完成</b><code>375 × 812</code><code>/checkout/done</code><code>電子收據</code></p>
  <div class="frame f-mobile">

    <div class="scroll c" style="padding:48px 16px 0;align-items:center;text-align:center">
      <div class="doneball">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="h1 mt24">付款完成</h1>
      <div class="display mt8" style="color:var(--brand-600)">NT$ 1,562</div>

      <div class="card card-tight mt24" style="width:100%;text-align:left">
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">交易編號</span><span class="v num">TXN-20260913-0417</span></div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">付款方式</span><span class="v">LINE Pay</span></div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">時間</span><span class="v num">2026/09/13 19:26</span></div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">桌號</span><span class="v">A03・3 位</span></div>
        <hr class="sep mt8">
        <div class="r g8 mt12">
          <svg class="ic" viewBox="0 0 24 24" style="color:var(--accent-600)"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg>
          <span class="t-sm" style="margin:0">這次獲得</span>
          <span class="fill"></span>
          <b class="num" style="color:var(--brand-600)">156 點</b>
        </div>
      </div>

      <div class="card card-tight mt12" style="width:100%;text-align:left;background:var(--accent-100);border-color:#EBD3A6">
        <div class="h3">加入會員，這 156 點才留得住</div>
        <p class="t-sm" style="margin:4px 0 12px">用手機號碼註冊，這筆消費的點數會自動補進去。</p>
        <button class="btn btn-primary btn-md btn-block">加入會員</button>
      </div>

      <p class="t-sm mt24" style="margin-bottom:0">感謝光臨，歡迎再來</p>
      <p class="t-cap">收據已存進「消費紀錄」，隨時可以調出來看</p>
    </div>

    <div class="bottombar">
      <button class="btn btn-secondary btn-lg btn-block">查看電子收據</button>
    </div>

  </div>
</div>

</div>
</body>
</html>
