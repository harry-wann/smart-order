<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-18｜預約 3 付款完成</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-18｜預約 步驟 3　付款完成</b><code>375 × 812</code><code>/reserve/done</code></p>
  <div class="frame f-mobile">

    <div class="steps" style="border-top:0">
      <span class="s done"><span class="n"><svg class="ic ic-sm" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M20 6 9 17l-5-5"/></svg></span>選時間</span>
      <span class="bar"></span>
      <span class="s done"><span class="n"><svg class="ic ic-sm" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M20 6 9 17l-5-5"/></svg></span>先點餐</span>
      <span class="bar"></span>
      <span class="s on"><span class="n">3</span>完成</span>
    </div>

    <div class="scroll c" style="padding:24px 16px 0;align-items:center;text-align:center">
      <div class="doneball">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="h1 mt24">訂位完成</h1>
      <p class="t-sm mt4" style="margin-bottom:0">到店時報預約編號或手機號碼就可以</p>

      <div class="card mt24" style="width:100%;text-align:left;padding:16px 20px">
        <div class="center" style="padding-bottom:16px;border-bottom:1px dashed var(--border)">
          <div class="t-cap">預約編號</div>
          <div class="h2 num" style="letter-spacing:.14em">R-260921-0043</div>
        </div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">日期時段</span><span class="v num">9/21（一）18:00</span></div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">人數</span><span class="v">4 位</span></div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">桌號</span><span class="v">A08・窗邊 4 人桌</span></div>
        <div class="sumrow" style="font-size:15px"><span class="k t-sm" style="margin:0">預先點餐</span><span class="v"><span class="badge b-pri">已付款・優先出餐</span></span></div>
        <div class="sumrow total"><span class="k">已付</span><span class="v num">NT$ 1,980</span></div>
      </div>

      <button class="btn btn-secondary btn-lg btn-block mt16">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 10h18M8 2.5v4M16 2.5v4M12 14v4M10 16h4"/></svg>
        加入行事曆
      </button>

      <div class="infobox ib-quiet mt16" style="text-align:left;margin-bottom:24px">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></svg>
        <div><b>取消政策</b><br>
          前一天（9/20）20:00 前可在「我的預約」取消，預先點餐的金額全額退回。
          逾時取消或沒到，這筆金額不退。<br>
          遲到 15 分鐘以上，桌位可能會先給現場候位的客人。</div>
      </div>
    </div>

    <div class="bottombar">
      <button class="btn btn-primary btn-lg btn-block">查看我的預約</button>
    </div>

  </div>
</div>

</div>
</body>
</html>
