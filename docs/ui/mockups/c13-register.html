<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-13｜會員註冊補資料</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-13｜會員註冊補資料</b><code>375 × 812</code><code>/auth/register</code><code>手機驗證通過後才會到這頁</code></p>
  <div class="frame f-mobile">

    <header class="appbar">
      <button class="iconbtn"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="ttl">完成註冊</div>
    </header>

    <div class="scroll" style="padding:24px 16px 0">
      <h1 class="h1">差幾個欄位就好</h1>
      <p class="t-sm mt8" style="margin-bottom:24px">留這些是為了叫得出你的名字、生日當月送一份甜點。都不是必填。</p>

      <label class="field">
        <span class="label">手機號碼</span>
        <div class="input r g8" style="background:var(--surface-2);color:var(--text-600)">
          <span class="num">0912-345-678</span>
          <span class="fill"></span>
          <span class="badge b-done">已驗證</span>
        </div>
      </label>

      <label class="field">
        <span class="label">怎麼稱呼你</span>
        <div class="input on r">陳小美</div>
        <span class="hint">出現在訂位紀錄和櫃檯畫面上</span>
      </label>

      <div class="field">
        <span class="label">性別</span>
        <div class="gr3">
          <div class="slot">女</div>
          <div class="slot">男</div>
          <div class="slot on">不透露</div>
        </div>
      </div>

      <label class="field">
        <span class="label">生日</span>
        <div class="input r g8">
          <svg class="ic ic-sm dim" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>
          <span class="num">1998 / 04 / 21</span>
        </div>
        <span class="hint">只用來判斷生日當月，不會顯示在任何地方</span>
      </label>

      <div class="r g12 mt24" style="align-items:flex-start;padding-bottom:24px">
        <span class="bx on" style="margin-top:2px"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span class="t-sm" style="margin:0">我同意店家保存我的消費紀錄用於累積點數。
          <button class="btn btn-ghost btn-sm" style="height:auto;padding:0;text-decoration:underline">看條款</button>
        </span>
      </div>
    </div>

    <div class="bottombar">
      <button class="btn btn-primary btn-lg btn-block">完成註冊</button>
      <button class="btn btn-ghost btn-md btn-block mt8">跳過，只留手機就好</button>
    </div>

  </div>
</div>

</div>
</body>
</html>
