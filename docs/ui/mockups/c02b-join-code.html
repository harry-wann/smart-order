<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-02b｜輸入開桌碼加入</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<!-- #thumbmode：總覽頁用 iframe 取縮圖時，只留第一個畫框 -->
<span id="thumbmode"></span>
<div class="stage">

<div>
  <p class="meta"><b>C-02b｜輸入開桌碼加入</b><code>375 × 812</code><code>/t/A03/join</code><code>開桌碼設定開啟時才會出現</code></p>
  <div class="frame f-mobile">

    <header class="appbar">
      <button class="iconbtn"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="ttl">加入 A03 桌</div>
    </header>

    <div class="scroll c" style="padding:48px 16px 0">
      <h1 class="h1">輸入開桌碼</h1>
      <p class="t-sm mt8" style="margin-bottom:0">
        桌上的收據或服務生會給你 4 位數字。<br>輸入後就能跟同桌的人看到同一張訂單。
      </p>

      <div class="otp mt32">
        <i class="on">7</i><i class="on">2</i><i class="on">4</i><i class="on">1</i>
      </div>
      <p class="hint" style="text-align:center">開桌碼由櫃檯開桌時產生，結帳後失效</p>

      <button class="btn btn-primary btn-lg btn-block mt24">加入這桌</button>

      <div class="infobox ib-quiet mt24">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></svg>
        <div>沒拿到開桌碼？請服務生報一次給你，<br>或直接到櫃檯出示這張桌號。</div>
      </div>

      <button class="btn btn-ghost btn-md mt16" style="align-self:center">我沒有開桌碼</button>
    </div>

    <div class="bottombar" style="padding-bottom:16px">
      <p class="t-cap center" style="margin:0">A03 桌　18:32 由櫃檯開桌</p>
    </div>

  </div>
</div>

<div class="sidenote">
  <b>錯誤時的文案</b>
  <dl style="margin:0">
    <dt>輸入錯誤</dt>
    <dd>四格轉紅框 + 「開桌碼不對，再確認一次」<br>不顯示英文錯誤碼</dd>
    <dt>錯 3 次</dt>
    <dd>「請洽櫃檯協助加入」，按鈕停用 60 秒</dd>
    <dt>這桌已結帳</dt>
    <dd>「本次用餐已結束，感謝光臨」</dd>
  </dl>
</div>

</div>
</body>
</html>
