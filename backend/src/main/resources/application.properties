spring.config.import=optional:file:.env[.properties]
spring.application.name=smart-order
server.address=127.0.0.1
server.port=8080

# MySQL：兩個資料庫的連線設定都由 backend/.env 提供，支援 MAMP、自行安裝或選用 Docker Compose。
# smartorder：專題本身的資料庫（主要那一組，見 tw.ispan.smartorder.config.SmartOrderDataSourceConfig）
app.datasource.smartorder.url=${SMARTORDER_DATASOURCE_URL}
app.datasource.smartorder.username=${SMARTORDER_DATASOURCE_USERNAME}
app.datasource.smartorder.password=${SMARTORDER_DATASOURCE_PASSWORD}

# northwind：只給 /api/northwind/** 的 demo API 使用（見 tw.ispan.northwind.config.NorthwindDataSourceConfig）
app.datasource.northwind.url=${NORTHWIND_DATASOURCE_URL}
app.datasource.northwind.username=${NORTHWIND_DATASOURCE_USERNAME}
app.datasource.northwind.password=${NORTHWIND_DATASOURCE_PASSWORD}

spring.jpa.open-in-view=false

# smartorder 的資料表之後交給 Flyway 管理；目前還沒有 Migration，先保留依賴但暫停執行。
spring.flyway.enabled=false

# 允許前端 dev server 跨來源呼叫 API；多個來源用逗號分隔。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cloudflare R2：憑證只放 backend/.env 或部署環境變數，不放進前端。
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket-name=${R2_BUCKET_NAME:}
app.r2.staging-bucket-name=${R2_STAGING_BUCKET_NAME:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.r2.max-upload-bytes=${R2_MAX_UPLOAD_BYTES:5242880}
app.r2.allow-anonymous-uploads=${R2_ALLOW_ANONYMOUS_UPLOADS:false}

# 傳入不存在的 JSON 欄位時直接回 400，避免使用者以為欄位有被更新。
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=TRACE

# 訂位（M7）：用餐 100 分 + 清桌 15 分 = 一筆訂位佔桌的時間；保留窗是訂位前 30 分到後 10 分
reservation.dining-minutes=100
reservation.buffer-minutes=15
reservation.hold-before-minutes=30
reservation.hold-after-minutes=10
reservation.bookable-days=30
reservation.first-slot=11:30
reservation.last-slot=20:00
reservation.slot-minutes=30
reservation.zone=Asia/Taipei
