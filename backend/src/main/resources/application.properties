spring.config.import=optional:file:.env[.properties]
spring.application.name=smart-order
server.address=127.0.0.1
server.port=8080

# MySQL：連線設定由 backend/.env 提供，支援 MAMP、自行安裝或選用 Docker Compose。
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Northwind 是已存在的練習資料庫，先不要讓 Hibernate 自動改表格。
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Northwind 由既有 SQL 匯入；Migration（資料庫版本遷移）先保留依賴但暫停執行。
spring.flyway.enabled=false

# 傳入不存在的 JSON 欄位時直接回 400，避免使用者以為欄位有被更新。
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=TRACE
