spring.config.import=optional:file:.env[.properties]
spring.application.name=smart-order
server.address=127.0.0.1
server.port=8080

# MySQL：兩個資料庫的連線設定都由 backend/.env 提供，支援 MAMP、自行安裝或選用 Docker Compose。
# smartorder：專題本身的資料庫（主要那一組，見 tw.ispan.smartorder.config.SmartOrderDataSourceConfig）
app.datasource.smartorder.url=${SMARTORDER_DATASOURCE_URL}
app.datasource.smartorder.username=${SMARTORDER_DATASOURCE_USERNAME}
app.datasource.smartorder.password=${SMARTORDER_DATASOURCE_PASSWORD}

# northwind：只給 /api/northwind/** 的 demo API 使用（見 tw.ispan.northwind.config.NorthwindDataSourceConfig）
app.datasource.northwind.url=${NORTHWIND_DATASOURCE_URL}
app.datasource.northwind.username=${NORTHWIND_DATASOURCE_USERNAME}
app.datasource.northwind.password=${NORTHWIND_DATASOURCE_PASSWORD}

spring.jpa.open-in-view=false

# smartorder 的資料表之後交給 Flyway 管理；目前還沒有 Migration，先保留依賴但暫停執行。
spring.flyway.enabled=false

# 允許前端 dev server 跨來源呼叫 API；多個來源用逗號分隔。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 桌位 QR code 要印的顧客端網址開頭（S-08）；QR 內容是 {這個}/order/checkin/{桌號}
# 不設定就是 localhost；用手機掃碼測試時，在 .env 設 CUSTOMER_BASE_URL=http://電腦的IP:5173
app.customer-base-url=${CUSTOMER_BASE_URL:http://localhost:5173}

# Cloudflare R2：憑證只放 backend/.env 或部署環境變數，不放進前端。
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket-name=${R2_BUCKET_NAME:}
app.r2.staging-bucket-name=${R2_STAGING_BUCKET_NAME:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.r2.max-upload-bytes=${R2_MAX_UPLOAD_BYTES:5242880}
app.r2.allow-anonymous-uploads=${R2_ALLOW_ANONYMOUS_UPLOADS:false}

# 傳入不存在的 JSON 欄位時直接回 400，避免使用者以為欄位有被更新。
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=TRACE

# 訂位（M7）：用餐 100 分 + 清桌 15 分 = 一筆訂位佔桌的時間；保留窗是訂位前 30 分到後 10 分
# 這幾個值對應 ReservationProperties（那邊的預設值跟這裡一樣），要調時間改這裡就好
# 一筆訂位佔桌 115 分（end_time 已經含清桌），開桌提醒的「115 分鐘窗」也是這個長度
reservation.dining-minutes=100
reservation.buffer-minutes=15
# 訂位前 30 分起桌子變成「預約保留」，也是客人線上取消的期限；訂位後 10 分沒報到就不再保留
reservation.hold-before-minutes=30
reservation.hold-after-minutes=10
# 線上只收明天起 30 天內，當天不接
reservation.bookable-days=30
# 可訂的開始時間是 11:30～20:00 之間的任意一分鐘（20:00 是最晚的開始時間，不是打烊時間）；
# slot-minutes 只決定可訂時段查詢列出的「建議時段」間隔，不限制建立訂位
reservation.first-slot=11:30
reservation.last-slot=20:00
reservation.slot-minutes=30
# 資料庫存的是店家當地時間（沒帶時區），回前端時用這個時區補上 +08:00，也不依賴伺服器本身的時區
reservation.zone=Asia/Taipei

# 員工 JWT：預設金鑰只能在 server.address 是本機時用（StaffJwtProvider 會擋）；
# 共用或部署環境一定要用環境變數 STAFF_JWT_SECRET 換掉，至少 32 字元
# 預設值寫在 ${...:預設} 後面，是為了 clone 下來不用設定就能在本機跑；
# 部署忘了設的話，因為 server.address 不是本機，應用程式會直接起不來，不會悄悄用這把公開的金鑰
app.staff-jwt.secret=${STAFF_JWT_SECRET:smart-order-local-dev-staff-jwt-secret-change-me}
# ISO-8601 的時間長度，PT12H 是 12 小時（一個班）
app.staff-jwt.ttl=PT12H

# 會員登入與同桌點餐的 JWT（tw.ispan.smartorder.util.JwtToken）：規則跟上面員工 JWT 一樣，
# 預設金鑰只能在 server.address 是本機時用；共用或部署環境一定要用環境變數 CUSTOMER_JWT_SECRET 換掉，至少 32 字元，
# 也不要跟 STAFF_JWT_SECRET 用同一把。金鑰外流的話，誰都能冒充任一位會員，或冒充某桌的客人收那桌的即時通知
app.customer-jwt.secret=${CUSTOMER_JWT_SECRET:smart-order-local-dev-customer-jwt-secret-change-me}

# 會員登入完成前的 mock（Bearer mock-member-{id}），預設關閉，只在本機 .env 開
# 開了以後誰都能冒用任一個會員，所以不能預設開；MemberIdentityResolver 開著時啟動會印警告。
# 換成真的會員 JWT 之後這個設定就可以拿掉
app.member-mock.enabled=${MEMBER_MOCK_ENABLED:false}

ecpay.merchant-id=${ECPAY_MERCHANT_ID:}
ecpay.hash-key=${ECPAY_HASH_KEY:}
ecpay.hash-iv=${ECPAY_HASH_IV:}
ecpay.action-url=${ECPAY_ACTION_URL:}
ecpay.return-url=${ECPAY_RETURN_URL:}
ecpay.client-back-url=${ECPAY_CLIENT_BACK_URL:}
